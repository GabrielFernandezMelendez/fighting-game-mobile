<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>NEÓN — revisión de VFX</title>
<style>html,body{margin:0;background:#211c33;color:#ffd27a;font:13px system-ui}canvas{display:block}#t{position:absolute;left:8px;top:6px}</style></head>
<body><div id="t">Polvo cel-shading · fila 1: dash (big) · fila 2: dash atrás · fila 3: salto/aterrizaje · columnas = tiempo (12 fps)</div>
<script type="module">
// Revisión aislada de los efectos: ?cols=6
import * as THREE from './vendor/three.module.js';
import { VFX } from './js/vfx.js';
const q = new URLSearchParams(location.search), cols = +(q.get('cols') || 6);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setClearColor(q.get('bg') || '#2b2540'); document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-0.5, cols * 2.4 - 1.9, 3 * 1.3 + 0.3, -0.2, -10, 10);
const vfx = new VFX(THREE, scene);
const rows = [{ dir: 1, big: true }, { dir: -1, big: true }, { dir: 0, big: false }];
rows.forEach((R, ri) => {
  const y = (2 - ri) * 1.3 + 0.15;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(cols * 2.4, 0.02), new THREE.MeshBasicMaterial({ color: '#3a3352' }));
  floor.position.set(cols * 1.2 - 1, y, -1); scene.add(floor);
  for (let c = 0; c < cols; c++) {
    const age = c / (cols - 1) * (R.big ? 0.46 : 0.34);
    vfx.puff(c * 2.4 + 0.6, y, R.dir, R.big, age);
    // pies del personaje (referencia de escala)
    const foot = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.12), new THREE.MeshBasicMaterial({ color: '#3b313e' }));
    foot.position.set(c * 2.4 + 0.6, y + 0.06, 1); scene.add(foot);
  }
});
vfx.update(0, cam);
r.render(scene, cam); window.READY = true;
</script></body></html>
